<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Update Task</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css">
    <style>
      body {
        background-color: #f8f9fa;
      }
      .card {
        border-radius: 1rem;
        box-shadow: 0 5px 15px rgba(0,0,0,0.05);
      }
      .form-control, .btn {
        border-radius: 0.5rem;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-dark bg-primary shadow">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">⬅️ Back to To Do App</a>
      </div>
    </nav>

    <div class="container my-5">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="card p-4">
            <h3 class="card-title mb-4">✏️ Update Task</h3>

            <form method="POST">
              <div class="mb-3">
                <label for="task" class="form-label">Task Title</label>
                <input type="text" class="form-control" id="task" name="task" value="{{ task.task }}" required>
              </div>

              <div class="mb-3">
                <label for="description" class="form-label">Task Description</label>
                <textarea class="form-control" id="description" name="description" rows="3" placeholder="Optional...">{{ task.description }}</textarea>
              </div>

              <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="completed" name="completed" {% if task.completed %}checked{% endif %}>
                <label class="form-check-label" for="completed">
                  Mark as Completed
                </label>
              </div>

              <button type="submit" class="btn btn-success w-100">✅ Update Task</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
